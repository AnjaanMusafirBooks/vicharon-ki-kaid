<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>धन्यवाद | विचारों की कैद</title>

  <style>
    *{
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    body{
      font-family:Arial, sans-serif;
      min-height:100vh;
      background:linear-gradient(135deg,#0f172a,#1e293b);
      color:#fff;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }

    .card{
      width:100%;
      max-width:520px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:24px;
      padding:40px 25px;
      text-align:center;
      box-shadow:0 20px 60px rgba(0,0,0,0.35);
      backdrop-filter:blur(12px);
    }

    .icon{
      width:72px;
      height:72px;
      margin:0 auto 22px;
      border-radius:50%;
      background:#22c55e;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:38px;
      color:white;
    }

    h1{
      font-size:32px;
      margin-bottom:12px;
    }

    .book{
      font-size:24px;
      font-weight:700;
      margin:18px 0 12px;
    }

    p{
      color:#cbd5e1;
      line-height:1.7;
      font-size:16px;
    }

    .note{
      margin-top:25px;
      padding:16px;
      border-radius:14px;
      background:rgba(255,255,255,0.07);
      font-size:14px;
      color:#e2e8f0;
      line-height:1.6;
    }

    .btn{
      display:inline-block;
      margin-top:25px;
      padding:14px 24px;
      border-radius:12px;
      background:#fff;
      color:#0f172a;
      text-decoration:none;
      font-weight:700;
    }

    .contact{
      margin-top:22px;
      font-size:13px;
      color:#94a3b8;
    }

    .contact a{
      color:#cbd5e1;
      text-decoration:none;
    }

    @media(max-width:480px){
      .card{
        padding:32px 20px;
      }

      h1{
        font-size:28px;
      }

      .book{
        font-size:21px;
      }
    }
  </style>
</head>

<body>

  <div class="card">

    <div class="icon">✓</div>

    <h1>धन्यवाद! ❤️</h1>

    <div class="book">विचारों की कैद</div>

    <p>
      आपकी खरीदारी के लिए धन्यवाद।
      हमें खुशी है कि आपने इस eBook को पढ़ने का निर्णय लिया।
    </p>

    <div class="note">
      आपकी eBook की delivery payment process पूरा होने के बाद
      निर्धारित तरीके से उपलब्ध कराई जाएगी।
    </div>

    <a class="btn" href="https://anjaanmusafirbooks.github.io/vicharon-ki-kaid/">
      मुख्य वेबसाइट पर वापस जाएँ
    </a>

    <div class="contact">
      किसी समस्या के लिए संपर्क करें:<br>
      <a href="mailto:officialsuperswagg@gmail.com">
        officialsuperswagg@gmail.com
      </a>
    </div>

  </div>

</body>
</html>
